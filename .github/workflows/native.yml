name: Native OBS source

on:
  push:
    paths:
      - "receiver/obs/cambridge-obs-source/**"
      - "protocol/**"
      - "scripts/receiver/linux/build-cambridge-obs-plugin.sh"
      - "scripts/receiver/linux/check-cambridge-obs-plugin-dependencies.sh"
      - "scripts/receiver/macos/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "receiver/obs/cambridge-obs-source/**"
      - "protocol/**"
      - "scripts/receiver/linux/build-cambridge-obs-plugin.sh"
      - "scripts/receiver/linux/check-cambridge-obs-plugin-dependencies.sh"
      - "scripts/receiver/macos/**"
      - ".github/workflows/native.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config libobs-dev \
            libavcodec-dev libavutil-dev libswscale-dev \
            libva-dev libva-drm2 libdrm-dev libjansson-dev \
            libavahi-client-dev
      - name: Build and test native source
        run: CAMBRIDGE_REQUIRE_AVAHI=ON ./scripts/receiver/linux/build-cambridge-obs-plugin.sh
      - name: Check native module dependencies
        run: ldd -r build/cambridge-obs-plugin/staging/obs-plugins/cambridge-obs-plugin/bin/64bit/cambridge-obs-plugin.so

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned FFmpeg and OBS libobs prerequisites
        env:
          CAMBRIDGE_MACOS_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: ./scripts/receiver/macos/prepare-cambridge-build-dependencies.sh
      - name: Check generated contract
        run: python3 scripts/development/check-cambridge-stream-contract.py
      - name: Build and test macOS native receiver for ${{ matrix.architecture }}
        env:
          CAMBRIDGE_MACOS_ARCHITECTURES: ${{ matrix.architecture }}
          CAMBRIDGE_REQUIRE_UNIVERSAL: OFF
        run: ./scripts/receiver/macos/build-cambridge-obs-plugin.sh
      - name: Check macOS module architecture and load commands
        env:
          CAMBRIDGE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/cambridge-obs-plugin-macos/staging/obs-plugins/cambridge-obs-plugin.plugin"
          plugin="${bundle}/Contents/MacOS/cambridge-obs-plugin"
          metallib="${bundle}/Contents/Resources/nv12_to_bgra.metallib"
          license="${bundle}/Contents/Resources/LICENSE"
          plist="${bundle}/Contents/Info.plist"
          test -d "${bundle}"
          test -f "${plugin}"
          test -f "${metallib}"
          test -f "${license}"
          plutil -lint "${plist}"
          codesign --verify --strict --verbose=2 "${bundle}"
          lipo "${plugin}" -verify_arch "${CAMBRIDGE_ARCHITECTURE}"
          if otool -L "${plugin}" | grep -Eq '/opt/homebrew|/usr/local/opt|/usr/local/Cellar|/opt/homebrew/Cellar'; then
            echo "unexpected Homebrew load command in ${plugin}" >&2
            exit 1
          fi
      - name: Upload verified macOS plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-obs-plugin-${{ matrix.architecture }}
          path: build/cambridge-obs-plugin-macos/staging/obs-plugins/cambridge-obs-plugin.plugin
          if-no-files-found: error
