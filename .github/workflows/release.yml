name: Release artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag version
        if: github.ref_type == 'tag'
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"

  android:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_SIGNING_STORE_PASSWORD}"
          test -n "${ANDROID_SIGNING_KEY_ALIAS}"
          test -n "${ANDROID_SIGNING_KEY_PASSWORD}"
          signing_file="${RUNNER_TEMP}/cambridge-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode >"${signing_file}"
          export ANDROID_SIGNING_STORE_FILE="${signing_file}"
          ./sender/android/gradlew -p sender/android assembleRelease --console=plain
          apk="sender/android/app/build/outputs/apk/release/app-release.apk"
          test -f "${apk}"
          mkdir -p dist
          cp "${apk}" "dist/cambridge-${GITHUB_REF_NAME}.apk"
          sha256sum "dist/cambridge-${GITHUB_REF_NAME}.apk" \
            >"dist/cambridge-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/

  native:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config file tar \
            libobs-dev \
            libavcodec-dev libavutil-dev libswscale-dev \
            libva-dev libva-drm2 libdrm-dev libjansson-dev \
            libavahi-client-dev
      - name: Build Linux x86_64 plugin package
        run: ./scripts/release/package-linux-plugin.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: |
            build/release/*.tar.gz
            build/release/*.tar.gz.sha256

  macos-build:
    if: vars.CAMBRIDGE_RELEASE_MACOS == 'true'
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned macOS build dependencies
        env:
          CAMBRIDGE_MACOS_ARCHITECTURE: ${{ matrix.architecture }}
        run: ./scripts/receiver/macos/prepare-cambridge-build-dependencies.sh
      - name: Build macOS plugin slice
        env:
          CAMBRIDGE_BUILD_DIR: build/cambridge-obs-plugin-macos-release
          CAMBRIDGE_STAGING_DIR: build/cambridge-obs-plugin-macos-release/staging
          CAMBRIDGE_BUILD_TYPE: Release
          CAMBRIDGE_MACOS_ARCHITECTURES: ${{ matrix.architecture }}
          CAMBRIDGE_REQUIRE_UNIVERSAL: OFF
        run: ./scripts/receiver/macos/build-cambridge-obs-plugin.sh
      - name: Stage macOS plugin slice
        env:
          CAMBRIDGE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/cambridge-obs-plugin-macos-release/staging/obs-plugins/cambridge-obs-plugin.plugin"
          plugin="${bundle}/Contents/MacOS/cambridge-obs-plugin"
          lipo -verify_arch "${CAMBRIDGE_ARCHITECTURE}" "${plugin}"
          mkdir -p "dist/${CAMBRIDGE_ARCHITECTURE}"
          cp -R "${bundle}" "dist/${CAMBRIDGE_ARCHITECTURE}/cambridge-obs-plugin.plugin"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-plugin-${{ matrix.architecture }}
          path: dist/${{ matrix.architecture }}/

  macos-package:
    if: vars.CAMBRIDGE_RELEASE_MACOS == 'true'
    needs: macos-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-plugin-arm64
          path: dist-input/arm64
      - uses: actions/download-artifact@v4
        with:
          name: macos-plugin-x86_64
          path: dist-input/x86_64
      - name: Import macOS signing identities and configure notarization
        env:
          CAMBRIDGE_APPLICATION_P12_BASE64: ${{ secrets.CAMBRIDGE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CAMBRIDGE_APPLICATION_P12_PASSWORD: ${{ secrets.CAMBRIDGE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          CAMBRIDGE_INSTALLER_P12_BASE64: ${{ secrets.CAMBRIDGE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          CAMBRIDGE_INSTALLER_P12_PASSWORD: ${{ secrets.CAMBRIDGE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          CAMBRIDGE_KEYCHAIN_PASSWORD: ${{ secrets.CAMBRIDGE_SIGNING_KEYCHAIN_PASSWORD }}
          CAMBRIDGE_NOTARY_PROFILE: ${{ secrets.CAMBRIDGE_NOTARY_PROFILE }}
          CAMBRIDGE_NOTARY_APPLE_ID: ${{ secrets.CAMBRIDGE_NOTARY_APPLE_ID }}
          CAMBRIDGE_NOTARY_TEAM_ID: ${{ secrets.CAMBRIDGE_NOTARY_TEAM_ID }}
          CAMBRIDGE_NOTARY_APP_PASSWORD: ${{ secrets.CAMBRIDGE_NOTARY_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required_values=(
            "${CAMBRIDGE_APPLICATION_P12_BASE64}"
            "${CAMBRIDGE_APPLICATION_P12_PASSWORD}"
            "${CAMBRIDGE_INSTALLER_P12_BASE64}"
            "${CAMBRIDGE_INSTALLER_P12_PASSWORD}"
            "${CAMBRIDGE_KEYCHAIN_PASSWORD}"
            "${CAMBRIDGE_NOTARY_PROFILE}"
            "${CAMBRIDGE_NOTARY_APPLE_ID}"
            "${CAMBRIDGE_NOTARY_TEAM_ID}"
            "${CAMBRIDGE_NOTARY_APP_PASSWORD}"
          )
          for required_value in "${required_values[@]}"; do
            test -n "${required_value}"
          done
          keychain_path="${RUNNER_TEMP}/cambridge-signing.keychain-db"
          application_p12="${RUNNER_TEMP}/cambridge-application.p12"
          installer_p12="${RUNNER_TEMP}/cambridge-installer.p12"
          printf '%s' "${CAMBRIDGE_APPLICATION_P12_BASE64}" | base64 -D >"${application_p12}"
          printf '%s' "${CAMBRIDGE_INSTALLER_P12_BASE64}" | base64 -D >"${installer_p12}"
          security create-keychain -p "${CAMBRIDGE_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${CAMBRIDGE_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${application_p12}" -k "${keychain_path}" \
            -P "${CAMBRIDGE_APPLICATION_P12_PASSWORD}" -T /usr/bin/codesign
          security import "${installer_p12}" -k "${keychain_path}" \
            -P "${CAMBRIDGE_INSTALLER_P12_PASSWORD}" -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${CAMBRIDGE_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          xcrun notarytool store-credentials "${CAMBRIDGE_NOTARY_PROFILE}" \
            --apple-id "${CAMBRIDGE_NOTARY_APPLE_ID}" \
            --team-id "${CAMBRIDGE_NOTARY_TEAM_ID}" \
            --password "${CAMBRIDGE_NOTARY_APP_PASSWORD}" \
            --keychain "${keychain_path}"
          printf 'CAMBRIDGE_NOTARY_KEYCHAIN=%s\n' "${keychain_path}" >>"${GITHUB_ENV}"
      - name: Assemble, sign, notarize, and staple macOS universal package
        env:
          CAMBRIDGE_BUILD_DIR: build/cambridge-obs-plugin-macos-release
          CAMBRIDGE_STAGING_DIR: build/cambridge-obs-plugin-macos-release/staging
          CAMBRIDGE_SKIP_BUILD: ON
          CAMBRIDGE_DEVELOPER_ID_APPLICATION: ${{ secrets.CAMBRIDGE_DEVELOPER_ID_APPLICATION }}
          CAMBRIDGE_DEVELOPER_ID_INSTALLER: ${{ secrets.CAMBRIDGE_DEVELOPER_ID_INSTALLER }}
          CAMBRIDGE_NOTARY_PROFILE: ${{ secrets.CAMBRIDGE_NOTARY_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          plugin_bundle="${CAMBRIDGE_STAGING_DIR}/obs-plugins/cambridge-obs-plugin.plugin"
          plugin_binary="${plugin_bundle}/Contents/MacOS/cambridge-obs-plugin"
          mkdir -p "${CAMBRIDGE_STAGING_DIR}/obs-plugins"
          cp -R dist-input/arm64/cambridge-obs-plugin.plugin "${plugin_bundle}"
          lipo -create \
            dist-input/arm64/cambridge-obs-plugin.plugin/Contents/MacOS/cambridge-obs-plugin \
            dist-input/x86_64/cambridge-obs-plugin.plugin/Contents/MacOS/cambridge-obs-plugin \
            -output "${plugin_binary}"
          ./scripts/release/package-macos-plugin.sh
      - name: Remove temporary macOS signing material
        if: always()
        env:
          CAMBRIDGE_KEYCHAIN_PASSWORD: ${{ secrets.CAMBRIDGE_SIGNING_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          keychain_path="${RUNNER_TEMP}/cambridge-signing.keychain-db"
          if [[ -e "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi
          rm -f "${RUNNER_TEMP}/cambridge-application.p12" \
            "${RUNNER_TEMP}/cambridge-installer.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-release
          path: |
            build/release/*.pkg
            build/release/*.pkg.sha256

  publish:
    if: >-
      always() && github.ref_type == 'tag' &&
      needs.android.result == 'success' &&
      needs.native.result == 'success' &&
      ((needs.macos-build.result == 'skipped' && needs.macos-package.result == 'skipped') ||
       (needs.macos-build.result == 'success' && needs.macos-package.result == 'success'))
    needs:
      - android
      - native
      - macos-build
      - macos-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_assets < <(find dist -type f -print0)
          test "${#release_assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
            --title "CamBridge ${GITHUB_REF_NAME}" --generate-notes
