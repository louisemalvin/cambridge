name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CamBridge release tag
        id: version
        run: |
          set -euo pipefail
          version=$(python3 scripts/development/cambridge_version.py --tag "${GITHUB_REF_NAME}")
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

  android:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Install pinned GStreamer Android SDK
        run: ./scripts/sender/android/prepare-gstreamer-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_SIGNING_STORE_PASSWORD}"
          test -n "${ANDROID_SIGNING_KEY_ALIAS}"
          test -n "${ANDROID_SIGNING_KEY_PASSWORD}"
          signing_file="${RUNNER_TEMP}/cambridge-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode >"${signing_file}"
          export ANDROID_SIGNING_STORE_FILE="${signing_file}"
          ./sender/android/gradlew -p sender/android assembleRelease --console=plain
          apk="sender/android/app/build/outputs/apk/release/app-release.apk"
          test -f "${apk}"
          mkdir -p dist
          release_version="${{ needs.verify-version.outputs.version }}"
          cp "${apk}" "dist/cambridge-android-${release_version}.apk"
          (
            cd dist
            sha256sum "cambridge-android-${release_version}.apk" \
              >"cambridge-android-${release_version}.apk.sha256"
            sha256sum --check "cambridge-android-${release_version}.apk.sha256"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/

  publish:
    needs:
      - verify-version
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - name: Publish one CamBridge GitHub release
        env:
          CAMBRIDGE_RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="${RUNNER_TEMP}/cambridge-release-notes.md"
          awk '/^## Unreleased$/ { include = 1; next } include && /^## / { exit } include { print }' \
            CHANGELOG.md >"${release_notes}"
          test -s "${release_notes}"
          mapfile -d '' release_assets < <(find dist -type f -print0)
          test "${#release_assets[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
            --verify-tag \
            --latest \
            --title "CamBridge ${CAMBRIDGE_RELEASE_VERSION}" \
            --notes-file "${release_notes}"
