name: Rust

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/rust.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GStreamer development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace
      - run: cargo build --manifest-path desktop/Cargo.toml --workspace

