name: Android

on:
  push:
    branches:
      - "**"
    paths:
      - "sender/android/**"
      - "protocol/**"
      - "VERSION"
      - "receiver/obs/cambridge-obs-source/buildspec.json"
      - "scripts/sender/android/prepare-gstreamer-android.sh"
      - "scripts/development/cambridge_version.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "sender/android/**"
      - "protocol/**"
      - "VERSION"
      - "receiver/obs/cambridge-obs-source/buildspec.json"
      - "scripts/sender/android/prepare-gstreamer-android.sh"
      - "scripts/development/cambridge_version.py"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Install pinned GStreamer Android SDK
        run: ./scripts/sender/android/prepare-gstreamer-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Check CamBridge version
        run: python3 scripts/development/cambridge_version.py --check
      - run: ./gradlew test lint assembleDebug compileDebugAndroidTestKotlin
        working-directory: sender/android
