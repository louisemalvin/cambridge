name: iOS

on:
  push:
    branches:
      - "**"
    paths:
      - "sender/ios/**"
      - "VERSION"
      - "sender/cambridge-video-settings.json"
      - "protocol/**"
      - "scripts/development/generate-cambridge-*.py"
      - "scripts/development/generate-ios-version.py"
      - "scripts/development/cambridge_version.py"
      - "scripts/sender/ios/**"
      - "scripts/receiver/linux/test-cambridge-fixture.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "sender/ios/**"
      - "VERSION"
      - "sender/cambridge-video-settings.json"
      - "protocol/**"
      - "scripts/development/generate-cambridge-*.py"
      - "scripts/development/generate-ios-version.py"
      - "scripts/development/cambridge_version.py"
      - "scripts/sender/ios/**"
      - "scripts/receiver/linux/test-cambridge-fixture.sh"
      - ".github/workflows/ios.yml"

jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run CamBridgeCore and parity checks
        run: ./scripts/sender/ios/check-core.sh
      - name: Build the Linux Swift interoperability fixture
        run: ./scripts/sender/ios/check-fixture.sh

  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Record selected Xcode
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          developer_directory=$(xcode-select -p)
          test -d "${developer_directory}"
          printf 'developer_directory=%s\n' "${developer_directory}"
          xcodebuild -version
      - name: Run CamBridgeCore package and parity checks
        run: ./scripts/sender/ios/check-core.sh
      - name: Build and test unsigned simulator app
        run: ./scripts/sender/ios/check-xcode.sh
