[package]
name = "receiver-control-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
receiver-core = { path = "../receiver-core" }
receiver-protocol = { path = "../receiver-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
