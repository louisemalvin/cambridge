[package]
name = "receiver-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mobile-webcam-receiver"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
receiver-control-http = { path = "../../crates/receiver-control-http" }
receiver-core = { path = "../../crates/receiver-core" }
receiver-gstreamer = { path = "../../crates/receiver-gstreamer" }
receiver-platform-linux = { path = "../../crates/receiver-platform-linux" }
receiver-protocol = { path = "../../crates/receiver-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[lints]
workspace = true
