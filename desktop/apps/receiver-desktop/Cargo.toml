[package]
name = "receiver-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mobile-webcam-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
gtk4 = { version = "0.11.4", features = ["v4_8"] }
receiver-control-http = { path = "../../crates/receiver-control-http" }
receiver-core = { path = "../../crates/receiver-core" }
receiver-discovery = { path = "../../crates/receiver-discovery" }
receiver-gstreamer = { path = "../../crates/receiver-gstreamer" }
receiver-platform-linux = { path = "../../crates/receiver-platform-linux" }
receiver-protocol = { path = "../../crates/receiver-protocol" }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
